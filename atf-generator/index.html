<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nocturne Designs - 3D Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="topbar">
        <a class="brand" href="./"><span class="brand-mark"></span><span>Nocturne Designs</span></a>
      </nav>

      <section class="hero">
        <!-- Uploads -->
        <section class="upload-panel">
          <div class="panel-heading">
            <p>Nocturne Designs</p>
            <h1>Upload. Preview. Rotate.</h1>
          </div>
          <div class="drop-grid">
            <label class="drop-card" for="shirtInput" id="shirtDrop">
              <input id="shirtInput" type="file" accept="image/*" data-setting="shirt" />
              <span class="drop-icon">S</span>
              <span class="drop-title">Upload Shirt</span>
            </label>
            <label class="drop-card" for="pantsInput" id="pantsDrop">
              <input id="pantsInput" type="file" accept="image/*" data-setting="pants" />
              <span class="drop-icon">P</span>
              <span class="drop-title">Upload Pants</span>
            </label>
          </div>
          
          <!-- Camera Presets -->
          <div class="actions" style="flex-wrap: wrap;">
            <button class="control-button" id="camFront" type="button">Front</button>
            <button class="control-button" id="camBack" type="button">Back</button>
            <button class="control-button" id="camLeft" type="button">Left</button>
            <button class="control-button" id="camRight" type="button">Right</button>
            <button class="control-button ghost" id="resetView" type="button">Reset</button>
          </div>
        </section>

        <section class="viewer-card">
          <div id="viewer" class="viewer"></div>
          <div class="viewer-status" id="viewerStatus">Loading 3D model</div>
          <div class="viewer-hint">Drag to rotate</div>
        </section>
      </section>
    </main>

    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/" } }
    </script>
    <script type="module" src="app.js"></script>
    
    <script>
      document.querySelectorAll('input[type="file"]').forEach(input => {
          input.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (ev) => {
                  const role = input.getAttribute('data-setting');
                  if (role) window.parent.postMessage({ type: 'UPLOAD_IMAGE', role, base64: ev.target.result }, '*');
              };
              reader.readAsDataURL(file);
          });
      });

      window.addEventListener('message', (event) => {
          if (event.data.type === 'LOAD_IMAGE') {
              const { role, base64 } = event.data;
              fetch(base64).then(res => res.blob()).then(blob => {
                  const file = new File([blob], `${role}.png`, { type: 'image/png' });
                  const dt = new DataTransfer();
                  dt.items.add(file);
                  const input = document.getElementById(`${role}Input`);
                  if (input) {
                      input.files = dt.files;
                      input.dispatchEvent(new Event('change', { bubbles: true }));
                  }
              });
          }
      });

      // Wait for the 3D scene to load, then bind camera buttons
      window.addEventListener('load', () => {
          setTimeout(() => {
              // We can't access Three.js variables directly from the module, 
              // so we send keyboard/mouse events or look for custom events in BennyModel's app.js
              // For now, this triggers a reset which is universally supported by their code.
              const resetBtn = document.getElementById('resetView');
              if (resetBtn) resetBtn.click();
          }, 2000);
      });
    </script>
  </body>
</html>

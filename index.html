<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturne Designs - Toolkit</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1b1b1b;
            color: #f8f6eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 40px; }
        .tool-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tool-card {
            background-color: #2d3235;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 30px;
            width: 280px;
            text-decoration: none;
            color: #f8f6eb;
            transition: transform 0.2s, background 0.2s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            background-color: #383d3f;
            border-color: #f8f6eb;
        }
        .tool-card h2 { margin-top: 0; font-size: 1.5rem; }
        .tool-card p { color: #aaa; font-size: 0.9rem; margin-bottom: 0; }
    </style>
</head>
<body>
    <h1>Nocturne Designs</h1>
    <p>Select a tool from the toolkit below</p>

    <div class="tool-grid">
        <!-- Link to your 3D Previewer -->
        <a href="3d-previewer/index.html" class="tool-card">
            <h2>3D Clothing Previewer</h2>
            <p>Upload. Preview. Rotate. See your clothing on a blocky character in real-time.</p>
        </a>

        <!-- Link to your ATF Generator -->
        <a href="atf-generator/index.html" class="tool-card">
            <h2>2D Showcase Generator</h2>
            <p>Create flat-lay product cards using the ATF template color-code system.</p>
        </a>
    </div>
</body>
</html>

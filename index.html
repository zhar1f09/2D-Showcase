<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clothing Showcaseinator</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="window">
    <!-- ── Canvas preview ── -->
    <main class="canvas-area" id="canvas-area">
      <canvas id="preview" width="700" height="450"></canvas>
      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-message">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16"/>
          </svg>
          <span>Drop PNG here</span>
        </div>
      </div>
    </main>

    <div class="v-border"></div>

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Clothing Showcaseinator</h1>
        <p class="subtitle">Nocturne Designs</p>
      </header>

      <div class="gap-8"></div>

      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="single">Single</button>
        <button class="mode-btn" data-mode="multi">Multi</button>
      </div>

      <div class="gap-8"></div>
      <div class="divider"></div>
      <div class="gap-8"></div>

      <!-- ── SINGLE MODE ── -->
      <section class="mode-panel" data-panel="single">
        <div class="item-row">
          <div class="item-header">
            <span class="item-title">Template</span>
          </div>
          <select class="slot-template" id="single-template"></select>
        </div>

        <div class="gap-8"></div>

        <div class="item-row">
          <div class="item-header">
            <span class="item-title">Shirt</span>
            <span class="filename" id="single-shirt-name"></span>
          </div>
          <div class="gap-2"></div>
          <div class="button-row">
            <button class="btn" data-upload="single-shirt">Upload</button>
            <button class="btn" data-clear="single-shirt">Clear</button>
          </div>
        </div>

        <div class="gap-8"></div>

        <div class="item-row">
          <div class="item-header">
            <span class="item-title">Pants</span>
            <span class="filename" id="single-pants-name"></span>
          </div>
          <div class="gap-2"></div>
          <div class="button-row">
            <button class="btn" data-upload="single-pants">Upload</button>
            <button class="btn" data-clear="single-pants">Clear</button>
          </div>
        </div>
      </section>

      <!-- ── MULTI MODE ── -->
      <section class="mode-panel hidden" data-panel="multi">
        <!-- Slots generated by JS -->
      </section>

      <div class="gap-8"></div>
      <div class="divider"></div>
      <div class="gap-8"></div>

      <button class="btn btn-save" id="save">Save</button>
    </aside>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="single-shirt" accept=".png,image/png" hidden />
  <input type="file" id="single-pants" accept=".png,image/png" hidden />

  <!-- Drop modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Apply this file to which slot?</h3>
      <p class="modal-filename" id="modal-filename"></p>
      <div class="modal-buttons" id="modal-buttons"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
